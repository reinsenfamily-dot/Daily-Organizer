<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>MyStash</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--text:#1c1e26;--muted:#6b7080;--accent:#4f46e5;--line:#e4e6ee;--chip:#e9eafc}
@media(prefers-color-scheme:dark){:root{--bg:#12131a;--card:#1c1e29;--text:#eceef6;--muted:#9096ab;--accent:#8b87ff;--line:#2b2e3d;--chip:#262942}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,sans-serif;padding-bottom:80px}
header{padding:16px 16px 8px;display:flex;justify-content:space-between;align-items:center}
h1{font-size:22px;margin:0}
.menu button{background:none;border:0;color:var(--muted);font-size:13px;padding:6px}
.wrap{max-width:640px;margin:0 auto;padding:0 12px}
.add{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}
textarea{width:100%;border:0;background:transparent;color:var(--text);font:inherit;resize:none;outline:none;min-height:56px}
.row{display:flex;gap:8px;margin-top:6px}
select,input[type=search]{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px;font:inherit}
select{flex:1;min-width:0}
.btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:9px 18px;font:inherit;font-weight:600}
.chips{display:flex;gap:6px;overflow-x:auto;padding:12px 0 8px;scrollbar-width:none}
.chip{flex:none;background:var(--chip);color:var(--text);border:0;border-radius:99px;padding:6px 12px;font-size:14px}
.chip.on{background:var(--accent);color:#fff}
.chip small{opacity:.7;margin-left:3px}
input[type=search]{width:100%;margin-bottom:10px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.main{cursor:pointer}
.title{font-weight:600;word-break:break-word}
.sub{color:var(--muted);font-size:13px;word-break:break-all;white-space:pre-wrap;margin-top:2px}
.meta{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--muted)}
.meta select{flex:none;padding:3px 6px;font-size:12px}
.meta .sp{flex:1}
.meta button{background:none;border:0;color:var(--muted);font-size:16px;padding:2px 6px}
.uses{background:var(--chip);color:var(--text);border-radius:99px;padding:2px 8px}
.empty{text-align:center;color:var(--muted);padding:40px 0}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:99px;font-size:14px;opacity:0;transition:.2s;pointer-events:none}
#toast.show{opacity:.95}
</style>
</head>
<body>
<header class="wrap"><h1>📌 MyStash</h1>
<div class="menu"><button id="exp">Export</button><button id="imp">Import</button><input id="file" type="file" accept=".json" hidden></div></header>
<div class="wrap">
  <div class="add">
    <textarea id="inp" placeholder="Paste a link, tip or note…"></textarea>
    <div class="row"><select id="cat"></select><button class="btn" id="save">Save</button></div>
  </div>
  <div class="chips" id="chips"></div>
  <input type="search" id="q" placeholder="Search…">
  <div id="list"></div>
</div>
<div id="toast"></div>
<script>
const CATS=["Games","Movies","Music","Christian","Tools","AI","Daily Tips","Self Development","Culinary","Hotel","Holiday","Others"];
const KW={
"Games":["steam","game","gaming","twitch","playstation","xbox","nintendo","epicgames","roblox","minecraft","genshin","mobile legends","walkthrough","gamer","fortnite"],
"Movies":["netflix","imdb","movie","film","disney","hbo","viu","vidio","trailer","series","cinema","rottentomatoes","letterboxd","tv","drama","bioskop"],
"Music":["spotify","music","song","lyrics","soundcloud","chord","album","apple music","genius.com","guitar","deezer","playlist","lagu"],
"Christian":["bible","alkitab","church","gereja","jesus","yesus","christ","devotion","renungan","gospel","verse","worship","pray","doa","sermon","youversion","biblegateway","kristen"],
"Tools":["tool","converter","pdf","compress","generator","editor","canva","figma","notion","github","extension","ilovepdf","tinypng","speedtest","vpn","excel","formula","shortcut","app","download","template"],
"AI":["chatgpt","openai","claude","anthropic","gemini","midjourney","prompt","perplexity","copilot","llm","ai","huggingface","deepseek","gpt","grok"],
"Daily Tips":["tip","trick","hack","how to","cara","clean","health","sleep","save money","daily","remember","hemat","sehari"],
"Self Development":["habit","productivity","book","podcast","mindset","learn","course","skill","motivation","coursera","udemy","ted","growth","journal","leadership","self","goal","buku","belajar"],
"Culinary":["recipe","resep","cook","masak","food","restaurant","cafe","kuliner","cookpad","menu","bake","ingredient","makan","tasty","gofood"],
"Hotel":["hotel","booking.com","agoda","traveloka","airbnb","hostel","resort","villa","tripadvisor","stay","penginapan"],
"Holiday":["holiday","trip","flight","travel","tiket","vacation","itinerary","visa","tour","beach","liburan","skyscanner","airline","pesawat","tiket.com"]
};
const RX={};for(const c in KW)RX[c]=KW[c].map(k=>new RegExp("\\b"+k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+(k.length<=3?"\\b":""),"i"));
const URLRX=/https?:\/\/[^\s]+|www\.[^\s]+/i;
const $=id=>document.getElementById(id);
let items=[],cur="All";
function load(){try{items=JSON.parse(localStorage.getItem("mystash")||"[]")}catch(e){items=[]}}
function persist(){try{localStorage.setItem("mystash",JSON.stringify(items))}catch(e){toast("Could not save – storage blocked")}}
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),1600)}
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function host(u){try{return new URL(u.startsWith("http")?u:"https://"+u).hostname.replace(/^www\./,"")}catch(e){return u}}
function detect(text){
  let best="Others",bs=0;const t=text.toLowerCase();
  for(const c of CATS){if(!RX[c])continue;let s=0;for(const r of RX[c])if(r.test(t))s++;if(s>bs){bs=s;best=c}}
  return best;
}
function add(){
  const raw=$("inp").value.trim();if(!raw)return;
  const m=raw.match(URLRX);const url=m?(m[0].startsWith("http")?m[0]:"https://"+m[0]):"";
  let note=raw.replace(URLRX,"").trim();
  const title=note?note.split("\n")[0].slice(0,80):host(url);
  const body=note.includes("\n")?note.split("\n").slice(1).join("\n").trim():"";
  let cat=$("cat").value;if(cat==="Auto")cat=detect(raw+" "+(url?host(url):""));
  items.push({id:Date.now()+Math.random(),title,body,url,cat,uses:0,last:0,created:Date.now()});
  persist();$("inp").value="";toast("Saved to "+cat);render();
}
function use(it){
  it.uses++;it.last=Date.now();persist();
  if(it.url){window.open(it.url,"_blank","noopener")}
  else{const txt=it.title+(it.body?"\n"+it.body:"");(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast("Copied")).catch(()=>toast("Marked as used"))}
  render();
}
function render(){
  const q=$("q").value.toLowerCase();
  const counts={All:items.length};CATS.forEach(c=>counts[c]=items.filter(i=>i.cat===c).length);
  $("chips").innerHTML=["All",...CATS].map(c=>`<button class="chip ${c===cur?"on":""}" data-c="${c}">${c}<small>${counts[c]}</small></button>`).join("");
  const list=items.filter(i=>(cur==="All"||i.cat===cur)&&(!q||(i.title+i.body+i.url+i.cat).toLowerCase().includes(q)))
    .sort((a,b)=>b.uses-a.uses||b.last-a.last||b.created-a.created);
  $("list").innerHTML=list.length?list.map(i=>`<div class="item" data-id="${i.id}">
    <div class="main" data-a="use"><div class="title">${esc(i.title)}</div>
    ${i.url?`<div class="sub">🔗 ${esc(host(i.url))}</div>`:""}${i.body?`<div class="sub">${esc(i.body)}</div>`:""}</div>
    <div class="meta"><select data-a="cat">${CATS.map(c=>`<option ${c===i.cat?"selected":""}>${c}</option>`).join("")}</select>
    <span class="uses">${i.uses}× used</span><span class="sp"></span>
    <button data-a="edit" title="Edit">✎</button><button data-a="del" title="Delete">🗑</button></div></div>`).join("")
    :`<div class="empty">Nothing here yet.<br>Paste something above 👆</div>`;
}
document.addEventListener("click",e=>{
  const c=e.target.closest(".chip");if(c){cur=c.dataset.c;render();return}
  const el=e.target.closest("[data-a]");if(!el)return;
  const row=e.target.closest(".item");const it=items.find(x=>String(x.id)===row.dataset.id);if(!it)return;
  const a=el.dataset.a;
  if(a==="use")use(it);
  if(a==="del"&&confirm("Delete this item?")){items=items.filter(x=>x!==it);persist();render()}
  if(a==="edit"){const v=prompt("Edit title",it.title);if(v!==null&&v.trim()){it.title=v.trim();const b=prompt("Edit note (optional)",it.body);if(b!==null)it.body=b.trim();persist();render()}}
});
document.addEventListener("change",e=>{
  if(e.target.dataset.a==="cat"){const it=items.find(x=>String(x.id)===e.target.closest(".item").dataset.id);it.cat=e.target.value;persist();render();toast("Moved to "+it.cat)}
});
$("save").onclick=add;$("q").oninput=render;
$("inp").addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.ctrlKey||e.metaKey))add()});
$("exp").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(items,null,1)],{type:"application/json"}));a.download="mystash-backup.json";a.click()};
$("imp").onclick=()=>$("file").click();
$("file").onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());if(!Array.isArray(d))throw 0;const ids=new Set(items.map(i=>i.id));d.forEach(i=>{if(!ids.has(i.id))items.push(i)});persist();render();toast("Imported "+d.length)}catch(x){toast("Invalid backup file")}e.target.value=""};
$("cat").innerHTML=["Auto",...CATS].map(c=>`<option value="${c}">${c==="Auto"?"Auto-categorise":c}</option>`).join("");
// Android share / paste-in via URL: ?text=...
const p=new URLSearchParams(location.search);const sh=[p.get("title"),p.get("text"),p.get("url")].filter(Boolean).join(" ");if(sh)$("inp").value=sh;
load();render();
</script>
</body>
</html>
